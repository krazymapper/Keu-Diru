name: Vérification des liens
on:
  schedule:
    - cron: '41 4 * * 1'   # hebdomadaire (fréquence à arbitrer — 01 §13 point 9)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: node scripts/check-links.mjs > link-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: link-report.json

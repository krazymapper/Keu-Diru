name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'   # Astro 7 exige Node >= 22.23
          cache: npm
      - run: npm ci
      - run: npx astro check
      - name: Tests unitaires (URL SQL/TS, i18n, seed, recherche)
        run: npm test
      - name: Tests base de données (migrations + RLS dans PGlite)
        run: npm run test:db
      - name: Build
        run: npx astro build
        env:
          BASE_PATH: /Keu-Diru
      - name: Liens internes (0 lien cassé toléré)
        run: node scripts/check-internal-links.mjs dist /Keu-Diru

name: Déploiement GitHub Pages
on:
  push:
    branches: [main]
  # Reconstruction quotidienne : publie les contributions approuvées entre deux commits
  schedule:
    - cron: '17 3 * * *'
  # Déclenchable par un webhook Supabase après modération (repository_dispatch)
  repository_dispatch:
    types: [catalog-updated]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm test && npm run test:db
      - run: npx astro build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://krazymapper.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/Keu-Diru' }}
          # Clé PUBLIQUE uniquement (variables, pas secrets) — jamais service_role (RM-16)
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          KEU_STRICT_DATA: ${{ vars.PUBLIC_SUPABASE_URL && '1' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
